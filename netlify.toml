[build]
  command = "npm run build"
  publish = "dist"

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173

# Necessário para que /admin (e qualquer outra rota do lado do cliente)
# funcione ao acessar direto pela URL ou dar refresh, sem afetar /api/*,
# que continua roteado para as Netlify Functions normalmente.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeçalhos de segurança básicos (não incluem CSP de propósito: o SDK do
# Mercado Pago carrega scripts e iframes de vários domínios dele).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Assets do build têm hash no nome: cache longo é seguro.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
